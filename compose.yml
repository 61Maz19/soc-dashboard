services:
  dashboard:
    build: .
    container_name: soc-dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    depends_on:
      - socket-proxy
    networks:
      - socket
      - default

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: soc-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    networks:
      - socket

networks:
  socket:
    internal: true